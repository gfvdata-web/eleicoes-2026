# Catálogo de versões do app Android "Apuração 2026" — fonte ÚNICA de versões.
# Nenhum build.gradle.kts escreve número de versão: tudo vem daqui (libs.*).
# Mesmas versões do app do painel-status (molde).

[versions]
# Níveis de SDK do Android (minSdk 26 = Android 8; target = versão atual).
minSdk = "26"
compileSdk = "37"
targetSdk = "37"

# Ferramentas de build. AGP 9.4 exige Gradle >= 9.6 (wrapper em
# gradle/wrapper/gradle-wrapper.properties) e JDK >= 17.
androidGradlePlugin = "9.4.1"
# Kotlin embutido do AGP 9: o plugin Compose usa esta mesma versão.
kotlin = "2.4.21"

# Bibliotecas
androidx-activity-compose = "1.13.0"
androidx-compose-bom = "2026.09.00"
androidx-lifecycle = "2.11.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
okhttp = "5.5.0"

# Testes
junit = "4.13.2"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
# O BOM fixa juntas as versões de todas as bibliotecas Compose abaixo (sem version.ref).
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# Ícones básicos (Refresh): o pacote "extended" é grande demais.
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
